// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versions are deliberately omitted. React Native's Gradle plugin is
        // supplied by the includeBuild in settings.gradle and provides the
        // matching Android Gradle plugin and Kotlin plugin versions from its
        // own version catalog. Pinning them here is what let this project
        // drift to AGP 8.7.3 / react-native-gradle-plugin 0.80.3 while
        // actually building against something else entirely.
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        google()
        // Central before jitpack, and present at all. Without it, artifacts that
        // live on Maven Central — org.jspecify and the Kotlin stdlib among them —
        // could only be fetched through jitpack's proxy, and Gradle disables a
        // whole repository after one timeout rather than falling back. A jitpack
        // outage therefore failed the build outright, which is what happened on
        // PR #52: Central served the same pom in 0.09s while jitpack timed out.
        // jitpack stays last, for anything genuinely hosted there.
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
