// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versions are deliberately omitted. React Native's Gradle plugin is
        // supplied by the includeBuild in settings.gradle and provides the
        // matching Android Gradle plugin and Kotlin plugin versions from its
        // own version catalog. Pinning them here is what let this project
        // drift to AGP 8.7.3 / react-native-gradle-plugin 0.80.3 while
        // actually building against something else entirely.
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        google()
        maven { url 'https://jitpack.io' }
    }
}
