buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : project.properties['AdadaptedReactNativeSdk_kotlinVersion']

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // The Android Gradle plugin and React Native Gradle plugin versions are
    // deliberately omitted, matching the React Native 0.87 template. React
    // Native's Gradle plugin is supplied by the consuming project's
    // includeBuild and provides the matching AGP version.
    //
    // These used to be pinned to AGP 8.7.2 and react-native-gradle-plugin
    // 0.75.1. The latter was never resolvable from any Maven repository - it
    // only ever worked because includeBuild substitutes by group:module and
    // ignores the version - so the pin silently meant nothing while looking
    // authoritative.
    classpath 'com.android.tools.build:gradle'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath 'com.facebook.react:react-native-gradle-plugin'
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['AdadaptedReactNativeSdk_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['AdadaptedReactNativeSdk_' + name]).toInteger()
}

android {
  namespace "com.adadapted.adadaptedreactnativesdk"
    // Driven by the consuming project's ext when present, falling back to the
    // AdadaptedReactNativeSdk_* values in gradle.properties. These were
    // previously hardcoded to 34 while gradle.properties advertised 33, so the
    // helpers below existed but were never used for SDK levels.
    //
    // No explicit floor is needed. react-android 0.87.0 publishes
    // aarMetadata minCompileSdk=34, so AGP already rejects any consumer below
    // 34 with an error naming react-android. That is exactly the value this
    // line hardcoded before, so deferring to the consumer gives up nothing.
    // Clamping with Math.max here would duplicate React Native's own
    // declaration, silently override the consumer instead of telling them, and
    // hardcode a number that goes stale.
    compileSdk getExtOrIntegerDefault('compileSdkVersion')
    buildToolsVersion getExtOrDefault('buildToolsVersion')
    defaultConfig {
      // Not ext-driven on purpose: 28 is this SDK's own floor and should not be
      // lowered by a consuming app.
      minSdkVersion 28
      targetSdk getExtOrIntegerDefault('targetSdkVersion')
      versionCode 1
    versionName "1.0"
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlin {
    jvmToolchain(17)
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault('kotlinVersion')

dependencies {
  api 'com.facebook.react:react-native:0.20.1'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
}

apply plugin: "com.facebook.react.rootproject"
